[project]
name = "CRSP Treasury"
description = "Treasury Securities Data from CRSP"
contributors = [
    "Jeremiah Bejarano",
]
repo_url = "https://github.com/ftsfr/crsp_treasury"
copyright = "2025"
os_compatibility = [
    "Windows",
    "Linux",
    "MacOS",
]

[notebooks.summary_treasury_bond_returns_ipynb]
name = "summary_treasury_bond_returns_ipynb"
description = "summary_treasury_bond_returns_ipynb"
path = "_output/_notebook_build/summary_treasury_bond_returns_ipynb.ipynb"
