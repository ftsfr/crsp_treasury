    "crsp",
    "treasury_auction_stats",
    "fed_yield_curve",
]
providers = [
    "WRDS",
    "TreasuryDirect",
    "Federal Reserve",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "",
]
tags = [
    "treasuries",
]
access_types = [
    "WRDS",
    "Web API",
    "Federal Reserve CSV",
]
license = "Yes"
restrictions = "Yes"
pull_method = "CRSP via WRDS API, runness from TreasuryDirect auction data merged by CUSIP and date, GSW model-implied prices from Fed Svensson parameters"
path = "./_data/crsp_treasury_daily.parquet"
date_col = "caldt"
docs_path = "./docs_src/crsp_treasury_daily.md"

[dataframes.treasury_auctions]
name = "treasury_auctions"
description = "Treasury auction data with runness calculations (frequently updated, no CRSP lag)"
sources = [
    "treasury_auction_stats",
]
providers = [
    "TreasuryDirect",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://treasurydirect.gov/TA_WS/securities/jqsearch",
]
tags = [
    "treasuries",
    "auctions",
]
access_types = [
    "Web API",
]
license = "Public Domain"
restrictions = "No"
pull_method = "TreasuryDirect Web API, runness calculated from auction data and merged by CUSIP and auction date"
path = "./_data/treasury_auctions.parquet"
date_col = "auctionDate"
docs_path = "./docs_src/treasury_auctions.md"

[dataframes.ftsfr_treas_bond_portfolio_returns]
name = "ftsfr_treas_bond_portfolio_returns"
description = "Treasury bond portfolio returns grouped by maturity buckets"
sources = [
    "CRSP Treasury Database",
]
providers = [
    "WRDS",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://wrds-www.wharton.upenn.edu/",
]
tags = [
    "treasury",
    "bonds",
    "portfolios",
    "returns",
]
access_types = [
    "WRDS Subscription",
]
license = "WRDS"
restrictions = "No"
pull_method = "Pulled from WRDS CRSP Treasury Database"
path = "./_data/ftsfr_treas_bond_portfolio_returns.parquet"
date_col = "ds"
docs = """
## Treasury Bond Portfolio Returns

This dataset contains portfolio returns grouped by maturity buckets.

It replicates the maturity-sorted U.S. Treasury bond test portfolios
(US_bonds_01-US_bonds_10) of He, Kelly, and Manela (2017), \"Intermediary
Asset Pricing: New Evidence from Many Asset Classes,\" Journal of Financial
Economics. The replication is verified month-by-month against the published
HKM data by `src/test_hkm_replication.py` (correlations above 0.99 per
portfolio in the overlapping sample).

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Maturity group (1-10, representing 6-month intervals from 0-5 years) |
| ds | Month-end date |
| y | Average monthly return for the maturity group |

### Maturity Groups

| Group | Maturity Range |
|-------|----------------|
| 1 | 0 to 6 months |
| 2 | 6 months to 1 year |
| 3 | 1 year to 1.5 years |
| 4 | 1.5 to 2 years |
| 5 | 2 to 2.5 years |
| 6 | 2.5 to 3 years |
| 7 | 3 to 3.5 years |
| 8 | 3.5 to 4 years |
| 9 | 4 to 4.5 years |
| 10 | 4.5 to 5 years |

### Data Source

CRSP US Treasury Database via WRDS
"""

[charts.treasury_returns_replication]
name = "Treasury Bond Portfolio Returns"
description = "Treasury bond portfolio returns from CRSP data"
dataframe = "ftsfr_treas_bond_portfolio_returns"
path = "./_output/treasury_returns_replication.html"
tags = [
    "treasury",
    "bonds",
    "returns",
    "replication",
]
publications = [
    "He, Kelly, and Manela (2017) - Intermediary Asset Pricing: New Evidence from Many Asset Classes",
    "Fama and French (1993) - Common risk factors in the returns on stocks and bonds",
]
docs = """
## Treasury Bond Portfolio Returns

Monthly Treasury bond returns from CRSP, grouped by maturity bucket.

These portfolios replicate the maturity-sorted U.S. Treasury bond test
portfolios (US_bonds_01-US_bonds_10) of He, Kelly, and Manela (2017),
\"Intermediary Asset Pricing: New Evidence from Many Asset Classes.\"
The replication is verified against the published HKM data by
`src/test_hkm_replication.py`.

### Maturity Groups

10 groups spanning 0-5 years in 6-month intervals.

### Data Source

CRSP US Treasury Database via WRDS
"""

[charts.treasury_cumulative_returns]
name = "Treasury Bond Portfolio Cumulative Returns"
description = "Cumulative returns showing growth of $1 invested in Treasury bond portfolios"
dataframe = "ftsfr_treas_bond_portfolio_returns"
path = "./_output/treasury_cumulative_returns.html"
tags = [
    "treasury",
    "bonds",
    "cumulative returns",
    "replication",
]
publications = [
    "He, Kelly, and Manela (2017) - Intermediary Asset Pricing: New Evidence from Many Asset Classes",
    "Fama and French (1993) - Common risk factors in the returns on stocks and bonds",
]
docs = """
## Treasury Bond Portfolio Cumulative Returns

Cumulative returns showing growth of $1 invested in Treasury bond portfolios from CRSP, grouped by maturity bucket.

The underlying portfolios replicate the maturity-sorted Treasury test
portfolios of He, Kelly, and Manela (2017).

### Maturity Groups

10 groups spanning 0-5 years in 6-month intervals.

### Calculation

Cumulative return = Product of (1 + monthly return) over time
"""
